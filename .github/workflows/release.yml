name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  RCLONE_VERSION: v1.74.4

jobs:
  verify:
    name: Verify release gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag matches package.json
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match package.json version $version"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Install Electron/Playwright system dependencies
        run: npx playwright install-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: E2E smoke tests
        run: xvfb-run --auto-servernum npm run test:e2e

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            rclone: darwin
            rclone_arch: amd64,arm64
            builder_args: --mac --x64 --arm64
            expected_artifacts: 4
          - os: windows-latest
            name: Windows
            rclone: win32
            rclone_arch: amd64,arm64
            builder_args: --win --x64 --arm64
            expected_artifacts: 2
          - os: ubuntu-latest
            name: Linux
            rclone: linux
            rclone_arch: amd64
            builder_args: --linux --x64
            expected_artifacts: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download rclone binaries (${{ matrix.rclone }}, checksum-verified)
        shell: bash
        run: node scripts/fetch-rclone.js --platform ${{ matrix.rclone }} --arch ${{ matrix.rclone_arch }}

      - name: Build TypeScript
        run: npm run build

      - name: Package with electron-builder
        run: npx electron-builder ${{ matrix.builder_args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert installer artifacts exist
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(release/*.dmg release/*.zip release/*.exe release/*.AppImage release/*.deb)
          if [ "${#artifacts[@]}" -lt "${{ matrix.expected_artifacts }}" ]; then
            echo "Expected at least ${{ matrix.expected_artifacts }} installer artifacts, got ${#artifacts[@]}."
            exit 1
          fi
          printf '%s\n' "${artifacts[@]}"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.rclone }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p dist-release
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} dist-release/ \;
          ls -la dist-release

      - name: Assert release payload is complete
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist-release/*)
          if [ "${#files[@]}" -lt 8 ]; then
            echo "Expected at least 8 installer artifacts, got ${#files[@]}."
            printf '%s\n' "${files[@]}"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## RcloneTray ${{ github.ref_name }}

            System-tray GUI for [Rclone](https://rclone.org/) — mount, sync, and serve your remotes.

            What changed: see the [changelog](https://github.com/ysalitrynskyi/RcloneTray/blob/master/CHANGELOG.md).

            ### Platform support

            **RcloneTray is developed and tested primarily on macOS.** Windows and Linux
            builds are provided and should work, but they are **not actively tested**. If you
            hit a problem on Windows or Linux, please [open an issue](https://github.com/ysalitrynskyi/RcloneTray/issues)
            (and PRs are very welcome).

            ### Install

            | Platform | File |
            |----------|------|
            | macOS 13+ (Intel `x64` / Apple Silicon `arm64`) | `.dmg` / `.zip` |
            | Windows (x64 / arm64) | `.exe` (NSIS installer) |
            | Linux (x64) | `.AppImage`, `.deb` |

            ### macOS first launch (unsigned app)

            Release builds are **not** signed or notarized yet. After installing from the `.dmg`,
            macOS may block the app with *"Apple could not verify…"*. This is expected.

            One-time fix (Terminal):

            ```bash
            xattr -dr com.apple.quarantine /Applications/RcloneTray.app
            ```

            Or right-click the app → **Open** → **Open**. See
            [Getting Started](https://github.com/ysalitrynskyi/RcloneTray/blob/master/docs/GETTING_STARTED.md) for the full walkthrough.

            ### Windows

            SmartScreen may warn about an unknown publisher — click **More info → Run anyway**.

            ### Linux

            Make the AppImage executable before running: `chmod +x RcloneTray-*.AppImage`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
