<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Activity</title>
  <link rel="stylesheet" href="../styles/ui.css">
</head>
<body>
  <main class="activity-shell">
    <header class="activity-header">
      <div>
        <h1>Activity</h1>
        <p>Mounts, transfers, servers, and recent rclone output.</p>
      </div>
      <div>
        <button type="button" class="btn btn-secondary" id="clear-btn">Clear finished</button>
        <button type="button" class="btn btn-secondary" id="refresh-btn">Refresh</button>
      </div>
    </header>
    <section class="activity-list" id="activity-list">
      <div class="state">Loading activity… <span class="spinner"></span></div>
    </section>
  </main>

  <script>
    (function () {
      const list = document.getElementById('activity-list');
      const refreshBtn = document.getElementById('refresh-btn');

      function renderEmpty() {
        list.textContent = '';
        const empty = document.createElement('div');
        empty.className = 'state';
        const title = document.createElement('div');
        title.className = 'state-title';
        title.textContent = 'No active or recent jobs.';
        const detail = document.createElement('div');
        detail.className = 'state-detail';
        detail.textContent = 'Mounts, syncs, and servers will appear here with logs, status, and failure details.';
        empty.append(title, detail);
        list.appendChild(empty);
      }

      function renderJob(job) {
        const card = document.createElement('article');
        card.className = 'job-card status-' + job.status;
        card.dataset.jobId = job.id;

        const top = document.createElement('div');
        top.className = 'job-topline';

        const title = document.createElement('div');
        title.className = 'job-title';
        title.textContent = job.label || job.id;

        const status = document.createElement('span');
        status.className = 'job-status';
        status.textContent = job.status;

        top.append(title, status);
        card.appendChild(top);

        const meta = document.createElement('div');
        meta.className = 'job-meta';
        meta.textContent = [
          job.kind,
          job.bookmarkName,
          job.uri,
          job.message
        ].filter(Boolean).join(' • ');
        card.appendChild(meta);

        if (job.progress) {
          const progress = document.createElement('div');
          progress.className = 'job-progress';
          progress.textContent = job.progress;
          card.appendChild(progress);
        }

        if (Array.isArray(job.logTail) && job.logTail.length) {
          const log = document.createElement('pre');
          log.className = 'job-log';
          log.textContent = job.logTail.slice(-8).join('\n');
          card.appendChild(log);
        }

        const actions = document.createElement('div');
        if (job.status === 'running') {
          const stop = document.createElement('button');
          stop.type = 'button';
          stop.textContent = 'Stop';
          stop.addEventListener('click', async () => {
            try {
              await $main.jobs.stop(job.id);
              refresh();
            } catch (error) {
              window.electronAPI.errorBox(error.message || String(error));
            }
          });
          actions.appendChild(stop);
        }
        if (Array.isArray(job.logTail) && job.logTail.length) {
          const copy = document.createElement('button');
          copy.type = 'button';
          copy.textContent = 'Copy log';
          copy.addEventListener('click', async () => {
            await navigator.clipboard.writeText(job.logTail.join('\n'));
          });
          actions.appendChild(copy);
        }
        if (actions.childNodes.length) {
          card.appendChild(actions);
        }

        return card;
      }

      function updateCard(card, job) {
        card.className = 'job-card status-' + job.status;
        const title = card.querySelector('.job-title');
        const status = card.querySelector('.job-status');
        const meta = card.querySelector('.job-meta');
        const log = card.querySelector('.job-log');
        const progress = card.querySelector('.job-progress');
        if (title) title.textContent = job.label || job.id;
        if (status) status.textContent = job.status;
        if (meta) {
          meta.textContent = [job.kind, job.bookmarkName, job.uri, job.message, job.progress].filter(Boolean).join(' • ');
        }
        if (progress) progress.textContent = job.progress || '';
        if (log && Array.isArray(job.logTail)) log.textContent = job.logTail.slice(-8).join('\n');
      }

      async function refresh() {
        try {
          const jobs = await $main.jobs.all();
          if (!jobs.length) {
            renderEmpty();
            return;
          }
          const seen = new Set();
          jobs.forEach(job => {
            seen.add(job.id);
            const existing = list.querySelector('[data-job-id="' + CSS.escape(job.id) + '"]');
            if (existing) {
              updateCard(existing, job);
            } else {
              list.appendChild(renderJob(job));
            }
          });
          list.querySelectorAll('[data-job-id]').forEach(card => {
            if (!seen.has(card.dataset.jobId)) card.remove();
          });
          const empty = list.querySelector('.state');
          if (empty) empty.remove();
        } catch (error) {
          list.textContent = '';
          const div = document.createElement('div');
          div.className = 'state error';
          div.textContent = 'Could not load activity: ' + (error.message || error);
          list.appendChild(div);
        }
      }

      document.getElementById('clear-btn').addEventListener('click', async () => {
        await $main.jobs.clearFinished();
        refresh();
      });
      refreshBtn.addEventListener('click', refresh);
      refresh();
      window.setInterval(refresh, 2000);
    })();
  </script>
</body>
</html>
