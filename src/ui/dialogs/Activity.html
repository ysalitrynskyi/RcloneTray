<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Activity</title>
  <link rel="stylesheet" href="../styles/ui.css">
</head>
<body>
  <main class="activity-shell">
    <header class="activity-header">
      <div>
        <h1>Activity</h1>
        <p>Mounts, transfers, servers, and recent rclone output.</p>
      </div>
      <div>
        <button type="button" class="btn btn-secondary" id="clear-btn">Clear finished</button>
        <button type="button" class="btn btn-secondary" id="refresh-btn">Refresh</button>
      </div>
    </header>
    <section class="activity-list" id="activity-list">
      <div class="state">Loading activity… <span class="spinner"></span></div>
    </section>
  </main>

  <script>
    (function () {
      const list = document.getElementById('activity-list');
      const refreshBtn = document.getElementById('refresh-btn');

      function renderEmpty() {
        list.textContent = '';
        const empty = document.createElement('div');
        empty.className = 'state';
        const title = document.createElement('div');
        title.className = 'state-title';
        title.textContent = 'No active or recent jobs.';
        const detail = document.createElement('div');
        detail.className = 'state-detail';
        detail.textContent = 'Mounts, syncs, and servers will appear here with logs, status, and failure details.';
        empty.append(title, detail);
        list.appendChild(empty);
      }

      function jobCardView(job) {
        const logTail = Array.isArray(job.logTail) ? job.logTail : [];
        return {
          className: 'job-card status-' + job.status,
          title: job.label || job.id,
          status: job.status,
          meta: [job.kind, job.bookmarkName, job.uri, job.message].filter(Boolean).join(' • '),
          progress: job.progress || '',
          logText: logTail.slice(-8).join('\n'),
          fullLog: logTail.join('\n'),
          canStop: job.status === 'running',
          canCopy: logTail.length > 0
        };
      }

      function setText(element, text) {
        if (element.textContent !== text) {
          element.textContent = text;
        }
      }

      function setLogText(log, text) {
        if (log.textContent === text) {
          return;
        }
        const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 4;
        const scrollTop = log.scrollTop;
        log.textContent = text;
        log.scrollTop = atBottom ? log.scrollHeight : scrollTop;
      }

      function setShown(element, shown) {
        const display = shown ? '' : 'none';
        if (element.style.display !== display) {
          element.style.display = display;
        }
      }

      function applyJobView(card, view) {
        if (card.className !== view.className) card.className = view.className;
        setText(card.querySelector('.job-title'), view.title);
        setText(card.querySelector('.job-status'), view.status);
        setText(card.querySelector('.job-meta'), view.meta);
        const progress = card.querySelector('.job-progress');
        setText(progress, view.progress);
        setShown(progress, view.progress !== '');
        const log = card.querySelector('.job-log');
        setLogText(log, view.logText);
        setShown(log, view.logText !== '');
        card.fullLog = view.fullLog;
        setShown(card.querySelector('.job-stop'), view.canStop);
        setShown(card.querySelector('.job-copy'), view.canCopy);
      }

      function renderJob(job) {
        const card = document.createElement('article');
        card.dataset.jobId = job.id;

        const top = document.createElement('div');
        top.className = 'job-topline';
        const title = document.createElement('div');
        title.className = 'job-title';
        const status = document.createElement('span');
        status.className = 'job-status';
        top.append(title, status);

        const meta = document.createElement('div');
        meta.className = 'job-meta';

        const progress = document.createElement('div');
        progress.className = 'job-progress';

        const log = document.createElement('pre');
        log.className = 'job-log';

        const actions = document.createElement('div');
        const stop = document.createElement('button');
        stop.type = 'button';
        stop.className = 'job-stop';
        stop.textContent = 'Stop';
        stop.addEventListener('click', async () => {
          try {
            await $main.jobs.stop(card.dataset.jobId);
            refresh();
          } catch (error) {
            window.electronAPI.errorBox(error.message || String(error));
          }
        });
        const copy = document.createElement('button');
        copy.type = 'button';
        copy.className = 'job-copy';
        copy.textContent = 'Copy log';
        copy.addEventListener('click', async () => {
          await navigator.clipboard.writeText(card.fullLog || '');
        });
        actions.append(stop, copy);

        card.append(top, meta, progress, log, actions);
        applyJobView(card, jobCardView(job));
        return card;
      }

      function updateCard(card, job) {
        applyJobView(card, jobCardView(job));
      }

      async function refresh() {
        try {
          const jobs = await $main.jobs.all();
          if (!jobs.length) {
            renderEmpty();
            return;
          }
          const seen = new Set();
          jobs.forEach(job => {
            seen.add(job.id);
            const existing = list.querySelector('[data-job-id="' + CSS.escape(job.id) + '"]');
            if (existing) {
              updateCard(existing, job);
            } else {
              list.appendChild(renderJob(job));
            }
          });
          list.querySelectorAll('[data-job-id]').forEach(card => {
            if (!seen.has(card.dataset.jobId)) card.remove();
          });
          const empty = list.querySelector('.state');
          if (empty) empty.remove();
        } catch (error) {
          list.textContent = '';
          const div = document.createElement('div');
          div.className = 'state error';
          div.textContent = 'Could not load activity: ' + (error.message || error);
          list.appendChild(div);
        }
      }

      document.getElementById('clear-btn').addEventListener('click', async () => {
        await $main.jobs.clearFinished();
        refresh();
      });
      refreshBtn.addEventListener('click', refresh);
      refresh();
      window.setInterval(refresh, 2000);
    })();
  </script>
</body>
</html>
